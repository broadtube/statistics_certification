statement: |
  4 個の変数 $x_1,\dots,x_4$ の分散共分散行列に基づいて主成分分析を行い、第 2 主成分までの結果を次の表にまとめた。第 1 主成分の $x_3$ の係数は $a$ として伏せてある。また、第 1 主成分と第 2 主成分で説明される分散の合計は 510 であった。

  | | 第 1 主成分 | 第 2 主成分 |
  |---|---:|---:|
  | $x_1$ の係数 | 0.48 | 0.36 |
  | $x_2$ の係数 | 0.36 | −0.48 |
  | $x_3$ の係数 | $a$ | −0.48 |
  | $x_4$ の係数 | 0.48 | −0.64 |
  | 寄与率 | 0.60 | 0.25 |

  元の 4 変数の分散の合計（総分散）として正しいものを選べ。
choices:
  - id: a
    text: '433.5'
    correct: false
  - id: b
    text: '510'
    correct: false
  - id: c
    text: '600'
    correct: true
  - id: d
    text: '850'
    correct: false
  - id: e
    text: '2040'
    correct: false
explanation: |
  第 $j$ 主成分の分散は固有値 $\lambda_j$ で、固有値の総和は元の変数の分散の合計（共分散行列のトレース）に等しい。寄与率は総分散に占める $\lambda_j$ の割合なので、第 2 主成分までの累積寄与率について次の式が成り立つ。

  $$
  r_1+r_2=\frac{\lambda_1+\lambda_2}{\sum_j\lambda_j}
  $$

  これを総分散について解くと、次のようになる。

  $$
  \sum_j\lambda_j=\frac{\lambda_1+\lambda_2}{r_1+r_2}=\frac{510}{0.60+0.25}=600
  $$

  確かめると、$\lambda_1=0.60\times 600=360$、$\lambda_2=0.25\times 600=150$ で、合計は 510 になる。

  **誤答の見分け方**: 433.5 は 510 に 0.85 を掛けた値、850 は第 1 主成分の寄与率 0.60 だけで割った値、2040 は第 2 主成分の寄与率 0.25 だけで割った値である。510 は 2 つの主成分で説明される分で、総分散は必ずこれより大きい。

  **補足**: 相関行列に基づく主成分分析では、各変数の分散が 1 なので、固有値の総和は変数の個数（ここでは 4）に等しい。総分散が 600 のように変数の個数と異なる値になるのは、分散共分散行列に基づく場合である。
