statement: |
  4 個の変数 $x_1,\dots,x_4$ の分散共分散行列に基づいて主成分分析を行い、第 2 主成分までの結果を次の表にまとめた。係数は、各主成分の係数ベクトルの長さが 1 となるように正規化されている。ただし、第 1 主成分の $x_3$ の係数は $a$ として伏せてある。

  | | 第 1 主成分 | 第 2 主成分 |
  |---|---:|---:|
  | $x_1$ の係数 | 0.48 | 0.36 |
  | $x_2$ の係数 | 0.36 | −0.48 |
  | $x_3$ の係数 | $a$ | −0.48 |
  | $x_4$ の係数 | 0.48 | −0.64 |
  | 固有値 | 360 | 150 |
  | 寄与率 | 0.60 | 0.25 |

  $a$ の値を、符号を含めて小数第 2 位まで求めよ。
explanation: |
  主成分の係数ベクトルは、共分散行列の固有ベクトルである。そのため、次の 2 つの条件を満たす。

  - 正規化: 各主成分の係数の二乗和は 1
  - 直交: 異なる主成分の係数の積和は 0

  **正規化だけでは符号が決まらない**: 第 1 主成分の係数の二乗和が 1 なので、

  $$
  a^2=1-(0.48^2+0.36^2+0.48^2)=1-0.5904=0.4096
  $$

  より $a=\pm 0.64$ となる。

  **直交で符号が決まる**: 第 1 主成分と第 2 主成分の積和が 0 なので、

  $$
  0.48\times 0.36+0.36\times(-0.48)+a\times(-0.48)+0.48\times(-0.64)=0
  $$

  前の 2 項は打ち消し合い、$-0.48a-0.3072=0$ となるので、$a=-0.64$ である。これは $a^2=0.4096$ とも一致する。

  **補足**: 固有値と寄与率はこの計算には使わない。また、係数ベクトル全体の符号を反転しても同じ主成分を表すが、表では他の係数の符号が決まっているので、$a$ の符号だけを自由に変えることはできない。第 2 主成分の $x_3$ の係数が 0 の場合は、直交条件に $a$ が現れないので、符号は決まらない。
answer: -0.64
