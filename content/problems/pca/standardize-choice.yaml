topics: [pca]
formulas: [pca-eigen]
difficulty: 1
type: choice
source: { kind: original }
statement: |
  身長（cm）、体重（kg）、年収（万円）の3変数に主成分分析を適用したい。分析方法に関する記述として最も適切なものを選べ。
choices:
  - id: a
    text: '単位が異なり分散の大きさが大きく違うので、相関行列（標準化した変数）に基づいて主成分分析を行う。'
    correct: true
  - id: b
    text: '分散共分散行列に基づく主成分分析と相関行列に基づく主成分分析は、常に同じ主成分を与える。'
    correct: false
  - id: c
    text: '分散共分散行列に基づけば、単位の影響を受けない主成分が得られる。'
    correct: false
  - id: d
    text: '主成分の数は、固有値が負になる直前までとする。'
    correct: false
  - id: e
    text: '第1主成分の係数ベクトルの符号は一意に定まる。'
    correct: false
explanation: |
  分散共分散行列に基づく主成分分析は、分散の大きい変数（ここでは単位の取り方しだいで年収など）に第1主成分が引きずられる。単位の異なる変数では標準化して相関行列に基づくのが一般的で、両者の結果は一般に一致しない。
  分散共分散行列は半正定値なので固有値は負にならず、固有ベクトルの符号は任意である。
