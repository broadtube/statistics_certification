topics: [tests-detail]
formulas: [paired-t-test, two-sample-pooled-t, welch-t-statistic, variance-ratio-f-test]
difficulty: 2
type: choice
source: { kind: original }
statement: |
  2つの平均の比較で用いる検定の選び方に関する次の記述のうち、正しいものを1つ選べ。
choices:
  - id: a
    text: '同じ12人について、新しい靴と従来の靴で走ったときのタイムをそれぞれ測った。2つの靴の平均タイムの差を調べるには、ペアごとの差を使った自由度 $11$ の t 検定が適している。'
    correct: true
  - id: b
    text: '上の a の12人のデータは、2つの独立な標本とみなして自由度 $22$ の等分散の2標本 t 検定を行っても、対応のある t 検定と同じ結論が常に得られる。'
    correct: false
  - id: c
    text: '独立な2群の比較で母分散が大きく異なりそうなときは、ウェルチの検定よりもプールした分散を使う2標本 t 検定の方が、有意水準を正しく保つ。'
    correct: false
  - id: d
    text: '先に F 検定で等分散性を調べ、有意でなければ等分散の t 検定、有意ならウェルチの検定を使う二段階の手順をとれば、最終的な検定の有意水準は名目の値にぴったり一致する。'
    correct: false
  - id: e
    text: '独立な2群の母平均の差を調べるには、2群の不偏分散の比 $S_1^2/S_2^2$ を F 分布と比べればよい。'
    correct: false
explanation: |
  a：同じ人を2条件で測ったデータは対応がある。差 $D_i$ について1標本の t 検定を行い、自由度は $n-1=11$。正しい。
  b：独立2標本とみなすと、個人差（ペア内の正の相関）が誤差に含まれるので、通常は統計量が小さくなり結論が変わりうる。誤り。
  c：分散が異なり、特に標本サイズも異なるとき、等分散の t 検定は第1種の過誤の確率が名目からずれる。分散が異なりそうなら [[formula:welch-t-statistic]] を使う。誤り。
  d：事前検定の結果によって後の検定を選ぶと、全体としての第1種の過誤の確率は名目の値からずれる。F 検定は正規性からのずれにも弱いので、初めからウェルチの検定を使う方がよいとされる。誤り。
  e：分散比の F 検定は分散が等しいかを調べるもので、平均の差は調べられない。誤り。
