topics: [tests-detail]
formulas: [one-sample-t-statistic]
difficulty: 1
type: numeric
source: { kind: original }
statement: |
  ある工程で作られる部品の長さの母平均が設計値 {{mu0}} mm から変わったかを調べるため、{{n}} 個を無作為に抜き取って測定したところ、標本平均 $\bar x={{xbar}}$ mm、標本標準偏差（不偏分散の平方根）$s={{s}}$ mm であった。$H_0:\mu={{mu0}}$ の t 検定統計量の値を求めよ（小数第3位まで）。
explanation: |
  分散未知なので
  $$
  t=\frac{\bar x-\mu_0}{s/\sqrt n}=\frac{ {{xbar}}-{{mu0}} }{ {{s}}/\sqrt{ {{n}} } }={{answer}}
  $$
  $H_0$ のもとで自由度 $n-1$ の t 分布に従う。
params:
  mu0: { min: 50, max: 50, step: 1 }
  n: { min: 8, max: 30, step: 1 }
  xbar: { min: 49, max: 51.5, step: 0.1 }
  s: { min: 0.5, max: 2.5, step: 0.1 }
constraints: ['abs(xbar - mu0) >= 0.2']
answer: (xbar - mu0) / (s / sqrt(n))
display: { digits: 3 }
tolerance: { type: absolute, value: 0.005 }
