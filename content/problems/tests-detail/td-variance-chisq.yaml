topics: [tests-detail]
formulas: [variance-chisq-test]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  ある充填機の充填量の母分散は、これまで $\sigma_0^2={{v0}}$ で管理されてきた。部品の交換後にばらつきが大きくなったかを調べるため、{{n}} 本を抜き取って測定したところ、不偏分散は $s^2={{v}}$ であった。充填量は正規分布に従うとして、$H_0:\sigma^2={{v0}}$、$H_1:\sigma^2>{{v0}}$ の片側検定の $p$ 値を求めよ（小数第3位まで）。
explanation: |
  検定統計量は
  $$
  \chi^2=\frac{(n-1)s^2}{\sigma_0^2}=\frac{ {{df}}\times{{v}} }{ {{v0}} }={{chi}}
  $$
  で、$H_0$ のもとで $\chi^2({{df}})$ に従う。対立仮説が「大きい」側なので上側確率をとり
  $$
  p=P\bigl(\chi^2({{df}})\ge{{chi}}\bigr)={{answer}}
  $$
params:
  n: { min: 10, max: 30, step: 1 }
  v0: { min: 4, max: 4, step: 1 }
  v: { min: 4.5, max: 9, step: 0.1 }
derived:
  df: n - 1
  chi: (n - 1) * v / v0
constraints: ['1 - pchisq((n - 1) * v / v0, n - 1) >= 0.01']
answer: 1 - pchisq((n - 1) * v / v0, n - 1)
display: { digits: 3 }
tolerance: { type: absolute, value: 0.002 }
