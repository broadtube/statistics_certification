topics: [glm]
formulas: [poisson-regression-model]
difficulty: 1
type: numeric
source: { kind: original }
statement: |
  ある設備の故障件数 $Y$ を、稼働時間 $t$（千時間）をオフセットとするポアソン回帰 $\log E[Y]=\log t+\beta_0+\beta_1x$ でモデル化し、$\hat\beta_0={{b0}}$、$\hat\beta_1={{b1}}$ を得た。$x={{x}}$、$t={{t}}$ のときの期待故障件数を求めよ（小数第3位まで）。
explanation: |
  $$
  \hat\mu=t\exp(\hat\beta_0+\hat\beta_1x)={{t}}\times\exp({{b0}}+{{b1}}\times{{x}})={{answer}}
  $$
  千時間あたりの故障率は $\exp(\hat\beta_0+\hat\beta_1x)$ で、$t$ に比例して期待件数が増える。
params:
  b0: { min: -2, max: 0, step: 0.25 }
  b1: { min: 0.1, max: 0.6, step: 0.1 }
  x: { min: 0, max: 4, step: 1 }
  t: { min: 2, max: 10, step: 1 }
answer: t * exp(b0 + b1 * x)
display: { digits: 3 }
