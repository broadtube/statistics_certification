    text: '自由度2のカイ二乗分布'
    correct: true
  - id: b
    text: '自由度3のカイ二乗分布'
    correct: false
  - id: c
    text: '自由度4のカイ二乗分布'
    correct: false
  - id: d
    text: '自由度1のカイ二乗分布'
    correct: false
  - id: e
    text: '自由度87のカイ二乗分布'
    correct: false
explanation: |
  全体のモデルの母数は $(\mu_1,\mu_2,\mu_3,\sigma^2)$ の4個、$H_0$ のもとでは $(\mu,\sigma^2)$ の2個。ウィルクスの定理より、自由度は差の $4-2=2$。
  $\sigma^2$ は両方のモデルで推定されるので自由度に数えない。87（$=90-3$）は分散分析の残差の自由度で、ここでは関係しない。
