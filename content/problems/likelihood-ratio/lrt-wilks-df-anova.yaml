statement: |
  独立な3群の観測値がそれぞれ $N(\mu_1,\sigma^2),\ N(\mu_2,\sigma^2),\ N(\mu_3,\sigma^2)$ に従う（$\sigma^2$ は共通で未知）。各群の標本サイズは30である。$H_0:\mu_1=\mu_2=\mu_3$ の尤度比検定について、$H_0$ のもとでの $-2\log\Lambda$ の漸近分布として正しいものを選べ。
choices:
