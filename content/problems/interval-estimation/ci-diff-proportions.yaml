topics: [interval-estimation]
formulas: [ci-diff-proportions]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  ある地域で、20代 {{n1}} 人のうち {{x1}} 人、60代 {{n2}} 人のうち {{x2}} 人が「電子書籍を月に1冊以上読む」と答えた。20代と60代の母比率の差 $p_1-p_2$ の95%信頼区間（ワルド型）の **下限** を求めよ。$z_{0.025}=1.96$ を用い、小数第4位まで答えよ。
explanation: |
  $\hat p_1={{x1}}/{{n1}}={{p1}}$、$\hat p_2={{x2}}/{{n2}}={{p2}}$。信頼区間では各群の比率を別々に使って標準誤差を求める：
  $$
  \sqrt{\frac{\hat p_1(1-\hat p_1)}{n_1}+\frac{\hat p_2(1-\hat p_2)}{n_2}}={{se}}
  $$
  下限は
  $$
  (\hat p_1-\hat p_2)-1.96\times{{se}}={{answer}}
  $$
  検定 $H_0:p_1=p_2$ のときのように2群をプールした比率は使わない。
params:
  n1: { min: 150, max: 500, step: 50 }
  n2: { min: 150, max: 500, step: 50 }
  q1: { min: 0.2, max: 0.6, step: 0.01 }
  q2: { min: 0.1, max: 0.4, step: 0.01 }
derived:
  x1: round(n1 * q1)
  x2: round(n2 * q2)
  p1: x1 / n1
  p2: x2 / n2
  se: sqrt(x1 / n1 * (1 - x1 / n1) / n1 + x2 / n2 * (1 - x2 / n2) / n2)
constraints: ['x1 / n1 - x2 / n2 >= 0.05']
answer: x1 / n1 - x2 / n2 - 1.96 * sqrt(x1 / n1 * (1 - x1 / n1) / n1 + x2 / n2 * (1 - x2 / n2) / n2)
display: { digits: 4 }
tolerance: { type: absolute, value: 0.001 }
