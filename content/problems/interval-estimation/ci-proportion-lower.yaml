topics: [interval-estimation]
formulas: [ci-proportion-wald]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  ある製品の利用者 {{n}} 人を無作為に選んで調査したところ、{{x}} 人が「満足」と答えた。満足と答える人の母比率 $p$ の95%信頼区間を、正規近似によるワルド型で求めたときの **下限** を答えよ（$z_{0.025}=1.96$ を用い、小数第3位まで）。
explanation: |
  $\hat p=\frac{ {{x}} }{ {{n}} }={{phat}}$。ワルド型の区間は $\hat p\pm1.96\sqrt{\hat p(1-\hat p)/n}$ なので、下限は
  $$
  {{phat}}-1.96\sqrt{\frac{ {{phat}}(1-{{phat}}) }{ {{n}} }}={{answer}}
  $$
params:
  n: { min: 100, max: 500, step: 50 }
  x: { min: 20, max: 300, step: 5 }
derived:
  phat: x / n
constraints: ['phat >= 0.1', 'phat <= 0.9']
answer: x / n - 1.96 * sqrt((x / n) * (1 - x / n) / n)
display: { digits: 3 }
tolerance: { type: absolute, value: 0.002 }
