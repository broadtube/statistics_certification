topics: [interval-estimation]
formulas: [ci-mean-known-variance]
difficulty: 1
type: choice
source: { kind: original }
statement: |
  ある母集団の平均 $\mu$ について、大きさ $n$ の標本から95%信頼区間 $[12.3,\ 15.1]$ が得られた。この結果の解釈として正しいものを選べ。
choices:
  - id: a
    text: '同じ方法で標本の抽出と区間の計算を何度も繰り返すと、得られる区間のおよそ95%が $\mu$ を含む。'
    correct: true
  - id: b
    text: '$\mu$ が区間 $[12.3,\ 15.1]$ に含まれる確率は0.95である。'
    correct: false
  - id: c
    text: '母集団の観測値のおよそ95%が区間 $[12.3,\ 15.1]$ に含まれる。'
    correct: false
  - id: d
    text: '同じ大きさの標本を取り直すと、その標本平均は95%の確率で区間 $[12.3,\ 15.1]$ に含まれる。'
    correct: false
  - id: e
    text: '標本サイズを4倍にすると、区間の幅はおよそ4分の1になる。'
    correct: false
explanation: |
  信頼係数は区間を作る **手順** の性質で、確率的に変動するのは区間の端点の方である。計算済みの区間 $[12.3,15.1]$ に対して $\mu$（定数）が含まれるかどうかは決まっており、確率0.95で含まれるという言い方（b）は頻度論の解釈では正しくない。
  c は観測値の分布（予測区間・許容区間）と混同している。d も成り立たない（区間の中心は真の $\mu$ ではない）。区間の幅は $1/\sqrt n$ に比例するので、$n$ を4倍にすると幅はおよそ半分になる（e は誤り）。
