topics: [interval-estimation]
formulas: [ci-mean-known-variance]
difficulty: 1
type: numeric
source: { kind: original }
statement: |
  標準偏差が $\sigma={{sigma}}$ であることがわかっている正規母集団から大きさ $n={{n}}$ の無作為標本を得たところ、標本平均は $\bar x={{xbar}}$ であった。母平均 $\mu$ の95%信頼区間の **上限** を求めよ（$z_{0.025}=1.96$ を用い、小数第2位まで）。
explanation: |
  分散既知なので $\frac{\bar X-\mu}{\sigma/\sqrt n}\sim N(0,1)$ をピボット量にする。上限は
  $$
  \bar x+1.96\times\frac{\sigma}{\sqrt n}={{xbar}}+1.96\times\frac{ {{sigma}} }{\sqrt{ {{n}} }}={{answer}}
  $$
params:
  sigma: { min: 2, max: 12, step: 1 }
  n: { min: 16, max: 100, step: 4 }
  xbar: { min: 40, max: 80, step: 0.5 }
answer: xbar + 1.96 * sigma / sqrt(n)
display: { digits: 2 }
