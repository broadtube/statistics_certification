topics: [interval-estimation]
formulas: [ci-variance-chisq]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  正規母集団から大きさ $n={{n}}$ の無作為標本を得たところ、不偏分散は $s^2={{s2}}$ であった。母分散 $\sigma^2$ の95%信頼区間の **下限** を求めよ。必要なら自由度 $n-1$ のカイ二乗分布の上側2.5%点 $\chi^2_{0.025}(n-1)={{chiu}}$、上側97.5%点 $\chi^2_{0.975}(n-1)={{chil}}$ を用い、小数第3位まで答えよ。
explanation: |
  $\frac{(n-1)S^2}{\sigma^2}\sim\chi^2(n-1)$ より
  $$
  P\left(\chi^2_{0.975}(n-1)\le\frac{(n-1)S^2}{\sigma^2}\le\chi^2_{0.025}(n-1)\right)=0.95
  $$
  これを $\sigma^2$ について解くと、下限は大きい方のパーセント点で割ったもの：
  $$
  \frac{(n-1)s^2}{\chi^2_{0.025}(n-1)}=\frac{({{n}}-1)\times{{s2}} }{ {{chiu}} }={{answer}}
  $$
params:
  n: { min: 8, max: 30, step: 1 }
  s2: { min: 2, max: 20, step: 0.5 }
derived:
  chiu: round(qchisq(0.975, n - 1), 3)
  chil: round(qchisq(0.025, n - 1), 3)
answer: (n - 1) * s2 / chiu
display: { digits: 3 }
