topics: [interval-estimation]
formulas: [ci-mean-t]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  正規母集団から大きさ $n={{n}}$ の無作為標本を得たところ、不偏分散の平方根（標本標準偏差）は $s={{s}}$ であった。母分散は未知である。母平均の95%信頼区間の **幅**（上限 − 下限）を求めよ。必要なら $t_{0.025}(n-1)={{tq}}$ を用い、小数第3位まで答えよ。
explanation: |
  分散未知なので $\frac{\bar X-\mu}{S/\sqrt n}\sim t(n-1)$ を使う。区間は $\bar x\pm t_{0.025}(n-1)\,s/\sqrt n$ で、幅はその2倍の半幅：
  $$
  2\times t_{0.025}({{n}}-1)\times\frac{s}{\sqrt n}=2\times{{tq}}\times\frac{ {{s}} }{\sqrt{ {{n}} }}={{answer}}
  $$
  幅は $\bar x$ の値によらない。
params:
  n: { min: 6, max: 30, step: 1 }
  s: { min: 1, max: 6, step: 0.5 }
derived:
  tq: round(qt(0.975, n - 1), 3)
answer: 2 * tq * s / sqrt(n)
display: { digits: 3 }
