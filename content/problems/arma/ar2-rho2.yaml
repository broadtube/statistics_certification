topics: [arma]
formulas: [yule-walker, ar2-stationarity]
difficulty: 3
type: numeric
source: { kind: original }
statement: |
  定常な AR(2) モデル $X_t={{phi1}}X_{t-1}+({{phi2}})X_{t-2}+\varepsilon_t$ のラグ2の自己相関係数 $\rho_2$ を求めよ（小数第4位まで）。
explanation: |
  ユール・ウォーカー方程式 $\rho_h=\phi_1\rho_{h-1}+\phi_2\rho_{h-2}$ を使う。
  - $h=1$：$\rho_1=\phi_1+\phi_2\rho_1$ より $\rho_1=\frac{\phi_1}{1-\phi_2}={{rho1}}$
  - $h=2$：$\rho_2=\phi_1\rho_1+\phi_2={{answer}}$
params:
  phi1: { min: 0.1, max: 1.2, step: 0.1 }
  phi2: { min: -0.6, max: 0.4, step: 0.1 }
constraints: ['phi1 + phi2 < 1', 'phi2 - phi1 < 1', 'abs(phi2) < 1', 'phi2 != 0']
derived:
  rho1: phi1 / (1 - phi2)
answer: phi1 * phi1 / (1 - phi2) + phi2
display: { digits: 4 }
