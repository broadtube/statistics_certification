topics: [survival-analysis]
formulas: [survival-weibull-hazard, survival-hazard-relation]
difficulty: 1
type: numeric
source: { kind: original }
statement: |
  生存時間 $T$ の生存関数が $S(t)=\exp\left\{-\left(\frac{t}{ {{eta}} }\right)^{ {{m}} }\right\}$（ワイブル分布）であるとき、時刻 $t={{t}}$ におけるハザード $h(t)$ を求めよ（小数第4位まで）。
explanation: |
  $h(t)=-\frac{d}{dt}\log S(t)=\frac{d}{dt}\left(\frac t\eta\right)^m=\frac m\eta\left(\frac t\eta\right)^{m-1}$。
  $m={{m}}$、$\eta={{eta}}$、$t={{t}}$ を代入して $h({{t}})={{answer}}$。
params:
  m: { min: 0.5, max: 3, step: 0.5 }
  eta: { min: 2, max: 10, step: 1 }
  t: { min: 1, max: 8, step: 1 }
constraints: ['m != 1']
answer: (m / eta) * (t / eta)^(m - 1)
display: { digits: 4 }
