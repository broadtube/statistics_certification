topics: [limit-theorems]
formulas: [lt-central-limit-theorem]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  成功確率 {{p}} の独立な試行を {{n}} 回行ったときの成功回数を $X$ とする。正規近似（連続修正あり）を用いて $P(X\le{{k}})$ を求めよ（小数第4位まで）。
explanation: |
  $E[X]=np={{n}}\times{{p}}$、$V[X]=np(1-p)$。中心極限定理より $X$ は近似的に正規分布に従う。
  $X$ は整数値なので、$X\le{{k}}$ を $X\le{{k}}+0.5$ と置き換える（連続修正）。
  $$
  P(X\le{{k}})\approx\Phi\left(\frac{ {{k}}+0.5-np}{\sqrt{np(1-p)}}\right)={{answer}}
  $$
params:
  n: { min: 50, max: 200, step: 10 }
  p: { min: 0.2, max: 0.6, step: 0.05 }
  k: { min: 10, max: 120, step: 1 }
constraints: ['abs(k - n * p) <= 2 * sqrt(n * p * (1 - p))', 'k != n * p']
answer: pnorm((k + 0.5 - n * p) / sqrt(n * p * (1 - p)))
display: { digits: 4 }
