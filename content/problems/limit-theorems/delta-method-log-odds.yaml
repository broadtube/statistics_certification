topics: [limit-theorems]
formulas: [lt-delta-method]
difficulty: 3
type: numeric
source: { kind: original }
statement: |
  成功確率 $p$ のベルヌーイ試行を $n={{n}}$ 回行い、標本比率 $\hat p={{phat}}$ を得た。デルタ法を用いて、対数オッズ $\log\frac{\hat p}{1-\hat p}$ の標準誤差を求めよ（$p$ を $\hat p$ で置き換えて計算し、小数第4位まで）。
explanation: |
  $\sqrt n(\hat p-p)\xrightarrow{d}N(0,p(1-p))$。$g(p)=\log\frac{p}{1-p}$ とすると $g'(p)=\frac1p+\frac1{1-p}=\frac{1}{p(1-p)}$。デルタ法より
  $$
  V\left[g(\hat p)\right]\approx g'(p)^2\frac{p(1-p)}{n}=\frac{1}{np(1-p)}
  $$
  よって標準誤差は $\frac{1}{\sqrt{n\hat p(1-\hat p)}}=\frac{1}{\sqrt{ {{n}}\times{{phat}}\times(1-{{phat}}) }}={{answer}}$。
params:
  n: { min: 50, max: 500, step: 50 }
  phat: { min: 0.1, max: 0.9, step: 0.05 }
answer: 1 / sqrt(n * phat * (1 - phat))
display: { digits: 4 }
