topics: [limit-theorems]
formulas: [lt-central-limit-theorem]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  標準偏差 {{s}} の母集団の平均 $\mu$ を標本平均で推定する。中心極限定理による正規近似のもとで、信頼度 95% の信頼区間の幅の半分（誤差の限界）を {{e}} 以下にしたい。必要な最小の標本サイズ $n$ を求めよ（$z=1.96$ を用いよ）。
explanation: |
  $\bar X\approx N(\mu,\sigma^2/n)$ より、95% の誤差の限界は $1.96\,\sigma/\sqrt n$。これが $e$ 以下となる条件は
  $$
  n\ge\left(\frac{1.96\,\sigma}{e}\right)^2=\left(\frac{1.96\times{{s}}}{ {{e}} }\right)^2
  $$
  これを満たす最小の整数は $n={{answer}}$。
params:
  s: { min: 5, max: 20, step: 5 }
  e: { min: 0.5, max: 2, step: 0.5 }
answer: ceil((1.96 * s / e)^2)
display: { digits: 0 }
