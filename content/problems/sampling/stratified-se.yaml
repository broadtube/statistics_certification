topics: [sampling]
formulas: [stratified-mean-variance]
difficulty: 3
type: numeric
source: { kind: original }
statement: |
  母集団を2つの層に分けて層化抽出を行った。層の大きさと標本サイズ、標本の不偏分散は次のとおりである。
  - 層1：$N_1={{N1}}$、$n_1={{n1}}$、$s_1^2={{v1}}$
  - 層2：$N_2={{N2}}$、$n_2={{n2}}$、$s_2^2={{v2}}$

  層化推定量 $\bar y_{st}$ の標準誤差の推定値を、有限母集団修正を含めて求めよ（小数第4位まで）。
explanation: |
  $W_1=\frac{ {{N1}} }{ {{N}} }$、$W_2=\frac{ {{N2}} }{ {{N}} }$（$N=N_1+N_2={{N}}$）。
  $$
  \widehat V[\bar y_{st}]=\sum_h W_h^2\left(1-\frac{n_h}{N_h}\right)\frac{s_h^2}{n_h}={{vst}}
  $$
  標準誤差は $\sqrt{ {{vst}} }={{answer}}$。
params:
  N1: { min: 200, max: 800, step: 100 }
  N2: { min: 200, max: 800, step: 100 }
  n1: { min: 20, max: 60, step: 10 }
  n2: { min: 20, max: 60, step: 10 }
  v1: { min: 4, max: 25, step: 1 }
  v2: { min: 25, max: 100, step: 5 }
derived:
  N: N1 + N2
  vst: (N1 / N)^2 * (1 - n1 / N1) * v1 / n1 + (N2 / N)^2 * (1 - n2 / N2) * v2 / n2
answer: sqrt(vst)
display: { digits: 4 }
