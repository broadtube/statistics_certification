topics: [mds, contingency-tables]
formulas: [ca-total-inertia]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  総度数 $n={{n}}$ の分割表に対応分析を行う。独立性のカイ二乗統計量は $\chi^2={{chi}}$ であり、第1軸の特異値は $\mu_1={{mu1}}$ であった。第1軸の寄与率（全慣性に対する第1軸の慣性の割合）を求めよ（小数第3位まで）。
explanation: |
  全慣性は $\dfrac{\chi^2}{n}=\dfrac{ {{chi}} }{ {{n}} }={{inertia}}$。第1軸の慣性は特異値の2乗 $\mu_1^2=({{mu1}})^2$。
  よって寄与率は $\dfrac{\mu_1^2}{\chi^2/n}={{answer}}$。
params:
  n: { min: 200, max: 500, step: 50 }
  chi: { min: 20, max: 80, step: 5 }
  mu1: { min: 0.15, max: 0.35, step: 0.05 }
derived:
  inertia: chi / n
constraints: ['mu1^2 < 0.95 * chi / n', 'mu1^2 > 0.4 * chi / n']
answer: mu1^2 / (chi / n)
display: { digits: 3 }
