topics: [hypothesis-testing]
formulas: [p-value-definition, test-error-types]
difficulty: 1
type: choice
source: { kind: original }
statement: |
  ある検定で $p$ 値 $0.03$ が得られた。この結果についての記述として正しいものを選べ。
choices:
  - id: a
    text: '帰無仮説が正しいとき、今回と同じかそれ以上に帰無仮説に不利な検定統計量の値が得られる確率が0.03である。'
    correct: true
  - id: b
    text: '帰無仮説が正しい確率が0.03である。'
    correct: false
  - id: c
    text: '対立仮説が正しい確率が0.97である。'
    correct: false
  - id: d
    text: '有意水準1%の検定でも帰無仮説は棄却される。'
    correct: false
  - id: e
    text: '$p$ 値が小さいので、母集団での効果の大きさは大きいと結論できる。'
    correct: false
explanation: |
  $p$ 値は「$H_0$ が正しいと仮定したときに、観測値と同じかそれ以上に極端な値が出る確率」である（a）。頻度論の検定では仮説そのものに確率を割り当てないので、b・c は誤り。
  $0.03>0.01$ なので有意水準1%では棄却されない（d は誤り）。$p$ 値は標本サイズにも依存し、大標本では小さな効果でも $p$ 値は小さくなるので、効果の大きさは別に評価する（e は誤り）。
