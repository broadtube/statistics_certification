topics: [hypothesis-testing]
formulas: [power-z-one-sided, test-error-types]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  標準偏差 $\sigma={{sigma}}$ が既知の正規母集団 $N(\mu,\sigma^2)$ から大きさ $n={{n}}$ の無作為標本をとり、$H_0:\mu={{mu0}}$ 対 $H_1:\mu>{{mu0}}$ を有意水準5%の z 検定で検定する。真の平均が $\mu={{mu1}}$ のときの検出力を求めよ（$z_{0.05}=1.645$ を用い、小数第3位まで）。
explanation: |
  棄却域は $\bar X>\mu_0+1.645\,\sigma/\sqrt n$。真の平均が $\mu_1$ のとき $\bar X\sim N(\mu_1,\sigma^2/n)$ なので
  $$
  1-\beta=P\left(Z>1.645-\frac{(\mu_1-\mu_0)\sqrt n}{\sigma}\right)=\Phi\left(\frac{({{mu1}}-{{mu0}})\sqrt{ {{n}} }}{ {{sigma}} }-1.645\right)=\Phi({{arg}})={{answer}}
  $$
params:
  mu0: { min: 50, max: 50, step: 1 }
  mu1: { min: 51, max: 55, step: 0.5 }
  sigma: { min: 4, max: 12, step: 1 }
  n: { min: 16, max: 64, step: 4 }
derived:
  arg: round((mu1 - mu0) * sqrt(n) / sigma - 1.645, 3)
constraints: ['arg > -0.8', 'arg < 2']
answer: pnorm((mu1 - mu0) * sqrt(n) / sigma - 1.645)
display: { digits: 3 }
tolerance: { type: absolute, value: 0.005 }
