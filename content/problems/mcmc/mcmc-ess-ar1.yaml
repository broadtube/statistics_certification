topics: [mcmc]
formulas: [mcmc-effective-sample-size]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  MCMC で得た長さ $M={{m}}$ の標本の自己相関がラグ $k$ で $\rho_k=({{rho}})^k$ と近似できるとする。有効標本サイズを求めよ（小数第1位まで）。
explanation: |
  $\sum_{k=1}^\infty\rho^k=\frac{\rho}{1-\rho}$ より $1+2\sum_{k\ge1}\rho^k=\frac{1+\rho}{1-\rho}$。よって
  $$
  M_{\mathrm{eff}}=M\frac{1-\rho}{1+\rho}={{m}}\times\frac{1-{{rho}}}{1+{{rho}}}={{answer}}
  $$
  標本平均の分散は、独立な標本がこの個数だけある場合と同程度になる。
params:
  m: { min: 1000, max: 10000, step: 1000 }
  rho: { min: 0.1, max: 0.9, step: 0.1 }
answer: m * (1 - rho) / (1 + rho)
display: { digits: 1 }
