topics: [mcmc]
formulas: [gibbs-sampling-step]
difficulty: 3
type: numeric
source: { kind: original }
statement: |
  平均 $(0,0)$、分散 $1$、相関係数 $\rho={{rho}}$ の2変量正規分布を目標とするギブスサンプリングで、ある時点の $x_2$ の値が ${{x2}}$ であった。次に生成する $x_1$ が正になる確率を求めよ（小数第4位まで）。
explanation: |
  2変量正規分布の条件付き分布は $x_1\mid x_2\sim N(\rho x_2,\ 1-\rho^2)$。よって
  $$
  P(x_1>0\mid x_2)=\Phi\!\left(\frac{\rho x_2}{\sqrt{1-\rho^2}}\right)=\Phi\!\left(\frac{ {{rho}}\times{{x2}} }{\sqrt{1-({{rho}})^2}}\right)={{answer}}
  $$
  $|\rho|$ が $1$ に近いと条件付き分散 $1-\rho^2$ が小さく、連鎖はゆっくりとしか動かない。
params:
  rho: { min: 0.3, max: 0.9, step: 0.1 }
  x2: { min: -2, max: 2, step: 0.5 }
constraints: ['x2 != 0']
answer: pnorm(rho * x2 / sqrt(1 - rho^2))
display: { digits: 4 }
