topics: [unit-root-arima]
formulas: [random-walk-forecast]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  ドリフト付きランダムウォーク $X_t={{delta}}+X_{t-1}+\varepsilon_t$（$\varepsilon_t$ は独立に $N(0,{{s}}^2)$）で、最新の観測値が $X_n={{xn}}$ であった。$X_{n+ {{h}} }$ の95%予測区間の上限を求めよ（小数第2位まで）。
explanation: |
  $X_{n+h}=X_n+h\delta+\sum_{s=1}^h\varepsilon_{n+s}$ なので、予測値は $X_n+h\delta$、予測誤差の分散は $h\sigma^2$。上限は
  $$
  X_n+h\delta+1.96\,\sigma\sqrt h={{xn}}+{{h}}\times{{delta}}+1.96\times{{s}}\sqrt{ {{h}} }={{answer}}
  $$
params:
  delta: { min: 0.1, max: 1, step: 0.1 }
  s: { min: 0.5, max: 3, step: 0.5 }
  xn: { min: 10, max: 50, step: 5 }
  h: { min: 2, max: 12, step: 1 }
answer: xn + h * delta + 1.96 * s * sqrt(h)
display: { digits: 2 }
