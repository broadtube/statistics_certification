topics: [contingency-tables, probability-basics]
formulas: [odds-ratio]
difficulty: 2
type: choice
source: { kind: original }
practical: true
statement: |
  ある店舗の来店客 620 人について、性別、広告を見たかどうか、商品を購入したかどうかを調べた。購入者と非購入者に分けて集計した人数は次のとおりである。この 620 人を全数として扱い、標本誤差は考えないものとする。

  **表1　購入者**

  | 性別 | 広告を見た | 広告を見ていない |
  |---|---:|---:|
  | 男性 | 60 | 20 |
  | 女性 | 30 | 10 |

  **表2　非購入者**

  | 性別 | 広告を見た | 広告を見ていない |
  |---|---:|---:|
  | 男性 | 40 | 160 |
  | 女性 | 60 | 240 |

  この 2 つの表からいえることとして、正しいものを選べ。
choices:
  - id: a
    text: '購入の有無を条件とすると性別と広告の視聴は独立であるが、2 つの表を合算すると性別と広告の視聴は独立ではない。'
    correct: true
  - id: b
    text: '購入の有無を条件とすると性別と広告の視聴は独立であり、2 つの表を合算しても性別と広告の視聴は独立である。'
    correct: false
  - id: c
    text: '購入者では性別と広告の視聴は独立であるが、非購入者では独立ではない。'
    correct: false
  - id: d
    text: '合算した表では性別と広告の視聴は独立であるが、購入の有無を条件とすると独立ではない。'
    correct: false
  - id: e
    text: '購入者に限ると、広告を見た確率は条件の向きによらず、$P(\text{広告を見た}\mid\text{男性})=P(\text{男性}\mid\text{広告を見た})$ が成り立つ。'
    correct: false
explanation: |
  **条件付き独立**: 性別を $X$、広告の視聴を $Y$、購入の有無を $Z$ とする。$X\perp Y\mid Z$ は、$Z$ の各値で $X$ と $Y$ が独立であることを意味する。2×2 表では、各表のオッズ比が 1 であることと同じである。

  $$
  \mathrm{OR}_{\text{購入者}}=\frac{60\times 10}{20\times 30}=1,\qquad \mathrm{OR}_{\text{非購入者}}=\frac{40\times 240}{160\times 60}=1
  $$

  広告を見た割合で確かめても、購入者では男女とも $0.75$、非購入者では男女とも $0.2$ で等しい。したがって、$X\perp Y\mid Z$ が成り立つ。

  **合算した表**: 2 つの表を足すと次のようになる。

  | 性別 | 広告を見た | 広告を見ていない | 広告を見た割合 |
  |---|---:|---:|---:|
  | 男性 | 100 | 180 | 約 0.357 |
  | 女性 | 90 | 250 | 約 0.265 |

  $$
  \mathrm{OR}_{\text{合算}}=\frac{100\times 250}{180\times 90}\approx 1.54
  $$

  オッズ比が 1 ではないので、合算すると独立ではない。男性は購入者の割合が高く（$80/280$ と $40/340$）、購入者は広告を見た割合が高いので、$Z$ を通じて $X$ と $Y$ に見かけの関連が生じている。

  **選択肢 (e)**: $P(\text{広告を見た}\mid\text{男性})=60/80=0.75$ に対し、$P(\text{男性}\mid\text{広告を見た})=60/90\approx 0.667$ で、条件の向きを変えると値は異なる。

  **論点**: 条件付き独立は周辺独立を意味せず、その逆も成り立たない。また、この問題は全数として扱ったので値を比べるだけで判断できるが、標本から母集団について判断するときは検定が必要である。
