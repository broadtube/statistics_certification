topics: [contingency-tables]
formulas: [fisher-exact-hypergeometric, fisher-exact-one-sided-p]
difficulty: 2
type: choice
source: { kind: original }
statement: |
  2×2分割表に対するフィッシャーの正確検定について、正しい記述を選べ。
choices:
  - id: a
    text: '行和と列和をすべて固定すると、独立の帰無仮説のもとで左上のセルの度数は超幾何分布に従い、その分布は未知の比率に依存しない。'
    correct: true
  - id: b
    text: '行和と列和を固定したとき、帰無仮説のもとで左上のセルの度数は、試行回数が行和の二項分布に従う。'
    correct: false
  - id: c
    text: 'カイ二乗近似の精度を保つため、すべての期待度数が5以上のときにしか使えない。'
    correct: false
  - id: d
    text: '片側 p 値は、観測された表そのものが得られる確率に等しい。'
    correct: false
  - id: e
    text: '超幾何分布は連続分布なので、有意水準5%の検定の第1種の過誤確率はちょうど5%にできる。'
    correct: false
explanation: |
  周辺度数を固定した条件付き分布は超幾何分布で、共通の比率などの局外母数が消える（a が正しい）。
  b：二項分布になるのは行和だけを固定した場合（列和は固定しない）。列和も固定すると超幾何分布になる。
  c：正確検定は期待度数が小さいときにこそ使う。近似を使わないので期待度数の条件はない。
  d：片側 p 値は観測表と、それより極端な表の確率の合計。
  e：超幾何分布は離散分布なので、第1種の過誤確率がちょうど5%になるとは限らず、検定は保守的になりやすい。
