topics: [discrete-distributions]
formulas: [geometric-mean]
difficulty: 1
type: numeric
source: { kind: original }
statement: |
  成功確率 {{p}} の独立な試行を、初めて成功するまで繰り返す。初めて成功するまでの **失敗回数** を $X$ とするとき、$E[X]$ を求めよ（小数第3位まで）。
explanation: |
  $P(X=k)=p(1-p)^k\ (k=0,1,\dots)$ の幾何分布なので $E[X]=\frac{1-p}{p}=\frac{1-{{p}}}{{{p}}}={{answer}}$。試行回数（成功の1回を含む）なら $1/p$ になる点に注意。
params:
  p: { min: 0.1, max: 0.9, step: 0.05 }
answer: (1 - p) / p
display: { digits: 3 }
