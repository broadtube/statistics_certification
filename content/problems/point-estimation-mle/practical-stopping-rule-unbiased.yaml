source: { kind: original }
practical: true
statement: |
  ある製品の不良率 $p$ $(0<p<1)$ は未知である。製品は互いに独立に、確率 $p$ で不良品となるとする。検査員 X と Y は、それぞれ次の方法で検査を行った。

  - X: はじめから 20 個検査すると決めて検査したところ、不良品は 4 個であった。
  - Y: 不良品が 4 個見つかるまで検査を続けたところ、20 個目で 4 個目の不良品が見つかった。

  2 人はそれぞれ自分の検査方法に対応する確率モデルのもとで、$p$ を最尤推定した。このときの記述として正しいものを選べ。
choices:
  - id: a
    text: '2 人の最尤推定値は等しい。X の最尤推定量は不偏であるが、Y の最尤推定量は不偏ではない。'
    correct: true
  - id: b
    text: '2 人の最尤推定値は等しく、どちらの最尤推定量も不偏である。'
    correct: false
  - id: c
    text: '2 人の最尤推定値は等しい。Y の最尤推定量は不偏であるが、X の最尤推定量は不偏ではない。'
    correct: false
  - id: d
    text: '2 人の最尤推定値は等しいが、どちらの最尤推定量も不偏ではない。'
    correct: false
  - id: e
    text: 'X の最尤推定値は $1/5$、Y の最尤推定値は $3/19$ であり、2 人の値は異なる。'
    correct: false
explanation: |
  **最尤推定値**: X は不良品数 $S\sim\mathrm{Bin}(20,p)$、Y は検査個数 $N$ が負の二項分布に従うので、尤度は次のとおり。

  $$
  L_X(p)=\binom{20}{4}p^4(1-p)^{16},\qquad L_Y(p)=\binom{19}{3}p^4(1-p)^{16}
  $$

  定数倍を除いて同じ関数なので、どちらも $\hat p=4/20=1/5$ で最大となる。

  **不偏性**: 推定値が同じでも、不偏性は「観測されなかった結果も含めた推定量の分布」で決まるので、実験の止め方に依存する。

  - X の推定量は $S/20$ で、$E[S/20]=p$ より不偏。
  - Y の推定量は $4/N$ である。$N\ge 4$ より $\dfrac{4}{N}\ge\dfrac{3}{N-1}$ で、$N>4$ のとき不等号は厳密に成り立つ。$p$ の不偏推定量は $3/(N-1)$ なので、$E[4/N]>p$ となり、上に偏る。

  選択肢 (e) の $3/19$ は Y の不偏推定量の値で、最尤推定値ではない。尤度が比例すれば推定値は一致するが（尤度原理）、不偏性まで一致するとは限らない、という点がこの問題の論点である。
