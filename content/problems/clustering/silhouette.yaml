topics: [clustering]
formulas: [cluster-silhouette]
difficulty: 1
type: numeric
source: { kind: original }
statement: |
  ある個体 $i$ について、同じクラスター内の他の個体との平均距離が $a(i)={{a}}$、最も近い他のクラスターの個体との平均距離が $b(i)={{b}}$ であった。個体 $i$ のシルエット係数を求めよ（小数第3位まで）。
explanation: |
  $$
  s(i)=\frac{b(i)-a(i)}{\max\{a(i),b(i)\}}=\frac{ {{b}}-{{a}} }{ {{mx}} }={{answer}}
  $$
  $s(i)$ が負のときは、所属しているクラスターより他のクラスターの方が近く、分類が適切でない可能性がある。
params:
  a: { min: 0.5, max: 3, step: 0.5 }
  b: { min: 1, max: 5, step: 0.5 }
derived:
  mx: max(a, b)
constraints: ['a != b']
answer: (b - a) / max(a, b)
display: { digits: 3 }
