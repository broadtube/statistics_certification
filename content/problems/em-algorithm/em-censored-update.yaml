topics: [em-algorithm]
formulas: [em-censored-exponential]
difficulty: 3
type: numeric
source: { kind: original }
statement: |
  指数分布（率 $\lambda$）に従う寿命データで、{{r}} 個は故障時間が観測され、{{m}} 個は観測打ち切り（その時点まで故障しなかったことだけがわかる）であった。観測された故障時間と打ち切り時点の合計は $T={{tt}}$ である。EM アルゴリズムで現在の値が $\lambda^{(t)}={{lam}}$ のとき、1回更新した $\lambda^{(t+1)}$ を求めよ（小数第4位まで）。
explanation: |
  E ステップ：無記憶性より、打ち切り時点 $c_j$ で打ち切られた個体の寿命の条件付き期待値は $c_j+1/\lambda^{(t)}$。完全データの合計寿命の期待値は $T+m/\lambda^{(t)}$。
  M ステップ：完全データ（$r+m$ 個）の指数分布の最尤推定量は「個数 ÷ 合計」なので
  $$
  \lambda^{(t+1)}=\frac{r+m}{T+m/\lambda^{(t)}}=\frac{ {{r}}+{{m}} }{ {{tt}}+{{m}}/{{lam}} }={{answer}}
  $$
  反復を続けると最尤推定値 $r/T$ に収束する。
params:
  r: { min: 5, max: 20, step: 1 }
  m: { min: 2, max: 10, step: 1 }
  tt: { min: 50, max: 200, step: 10 }
  lam: { min: 0.05, max: 0.3, step: 0.05 }
answer: (r + m) / (tt + m / lam)
display: { digits: 4 }
