topics: [regression-diagnostics]
formulas: [vif-definition]
difficulty: 1
type: numeric
source: { kind: original }
statement: |
  説明変数 $x_1,\dots,x_4$ を用いた重回帰で、$x_2$ を他の説明変数 $x_1,x_3,x_4$（と切片）で回帰したときの決定係数は $R_2^2={{r2}}$ であった。$x_2$ の分散拡大要因 $\mathrm{VIF}_2$ を求めよ（小数第2位まで）。
explanation: |
  $\mathrm{VIF}_2=\dfrac{1}{1-R_2^2}=\dfrac{1}{1-{{r2}}}={{answer}}$。
  $\hat\beta_2$ の分散は、$x_2$ が他の説明変数と無相関な場合に比べてこの倍率だけ大きくなる。
params:
  r2: { min: 0.3, max: 0.95, step: 0.05 }
answer: 1 / (1 - r2)
display: { digits: 2 }
