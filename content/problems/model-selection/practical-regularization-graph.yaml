explanation: |
  (1) は L1 正則化（ラッソ）、(2) は L2 正則化（リッジ）、(3) は両者を組み合わせたエラスティックネットである。

  **推定量の形**: $X^\top X=I$ のとき、最小二乗推定値を $b_j$ とすると $\|\boldsymbol y-X\boldsymbol\beta\|^2=\sum_j(\beta_j-b_j)^2+\text{定数}$ なので、係数ごとに別々に最小化できる。罰則を $\lambda_1\sum_j|\beta_j|+\lambda_2\sum_j\beta_j^2$ とすると、解は次のとおり。

  $$
  \hat\beta_j=\frac{\operatorname{sign}(b_j)\,\max\!\left(|b_j|-\lambda_1/2,\ 0\right)}{1+\lambda_2}
  $$

  | 目的関数 | $\lambda_1$ | $\lambda_2$ | $b_1=4$ の推定値 | 0 の個数 |
  |---|---|---|---|---|
  | (1) | 2 | 0 | 3 | 5 |
  | (2) | 0 | 1 | 2 | 0 |
  | (3) | 1 | 1/2 | 約 2.33 | 3 |

  **図との対応**: A は 0 の係数がなく、すべてが最小二乗推定値のちょうど半分なので (2)。C は $|b_j|\le 1$ の 5 個が 0 で、残りは絶対値が 1 ずつ小さいので (1)。B は $|b_j|\le 1/2$ の 3 個が 0 なので (3) である。

  **注意**: 「0 が多いほうがラッソ」とは言い切れない。エラスティックネットも L1 項を含むので係数を 0 にでき、0 の個数は $\lambda_1$ の大きさで変わる。図だけで判断せず、式の罰則の強さと合わせて確認する。
