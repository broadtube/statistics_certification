statement: |
  10 個の説明変数をもつ線形回帰モデル $\boldsymbol y=X\boldsymbol\beta+\boldsymbol\varepsilon$ を考える。計画行列は $X^\top X=I$ を満たすとする。同じデータに対し、次の 3 つの目的関数を $\boldsymbol\beta$ について最小化して係数を推定した。

  $$
  \begin{aligned}
  (1)\quad & \|\boldsymbol y-X\boldsymbol\beta\|^2+2\sum_{j=1}^{10}|\beta_j| \\
  (2)\quad & \|\boldsymbol y-X\boldsymbol\beta\|^2+\sum_{j=1}^{10}\beta_j^2 \\
  (3)\quad & \|\boldsymbol y-X\boldsymbol\beta\|^2+\sum_{j=1}^{10}|\beta_j|+\frac12\sum_{j=1}^{10}\beta_j^2
  \end{aligned}
  $$

  次の図は、最小二乗推定値と、3 つの推定結果 A、B、C を、番号 $j$ ごとに示したものである（縦軸は係数の値）。

  ![最小二乗推定値と推定結果A、B、Cの係数を番号ごとに示した4枚の図。Aの係数は0になるものがなく、全体が最小二乗推定値の半分である。Bは番号8から10の3個が0で、番号1の値は約2.3である。Cは番号6から10の5個が0で、番号1の値は3である。](figures/regularization-coefficients.svg)

  A、B、C と目的関数 (1)〜(3) の組合せとして正しいものを選べ。
