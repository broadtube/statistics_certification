topics: [bootstrap]
formulas: [bootstrap-standard-error, jackknife-standard-error]
difficulty: 2
type: choice
source: { kind: original }
statement: |
  ブートストラップ法とジャックナイフ法に関する記述として正しいものを選べ。
choices:
  - id: a
    text: '標本中央値の標準誤差はジャックナイフでは一致推定できないが、ブートストラップでは推定できる。'
    correct: true
  - id: b
    text: 'ブートストラップ標本は、元の標本から $n$ 個を非復元抽出して作る。'
    correct: false
  - id: c
    text: '反復回数 $B$ を十分大きくすれば、元の標本サイズ $n$ が小さくても標準誤差の推定精度はいくらでも高くなる。'
    correct: false
  - id: d
    text: '時系列データでも、各時点の観測値を独立に復元抽出すれば自己相関の構造は保たれる。'
    correct: false
  - id: e
    text: '標本最大値の分布は、ブートストラップによって常に精度よく近似できる。'
    correct: false
explanation: |
  ジャックナイフは統計量が滑らかであることを前提とし、標本中央値のように1点の除去で値が飛ぶ統計量では標準誤差が一致しない。ブートストラップは中央値にも適用できる。
  (b) 復元抽出で作る。(c) $B$ で減るのはモンテカルロ誤差だけで、$\hat F_n$ と真の分布のずれによる誤差は残る。(d) 時点ごとの独立な再抽出は自己相関を壊すので、ブロック・ブートストラップなどを使う。(e) 最大値はブートストラップ標本で元の最大値に一致する確率が約 $0.632$ と高く、うまく近似できない典型例。
