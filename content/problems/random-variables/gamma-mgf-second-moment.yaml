topics: [random-variables]
formulas: [rv-mgf-independent-sum]
difficulty: 2
type: numeric
source: { kind: original }
statement: |
  確率変数 $X$ の積率母関数が $M_X(t)=\left(1-\frac{t}{ {{beta}} }\right)^{-{{alpha}} }\ \left(t<{{beta}}\right)$ であるとき、$E[X^2]$ を求めよ（小数第3位まで）。
explanation: |
  $M_X(t)=(1-t/\beta)^{-\alpha}$ を微分すると
  $M_X'(t)=\frac{\alpha}{\beta}(1-t/\beta)^{-\alpha-1}$、$M_X''(t)=\frac{\alpha(\alpha+1)}{\beta^2}(1-t/\beta)^{-\alpha-2}$。
  $$
  E[X^2]=M_X''(0)=\frac{ {{alpha}}\times({{alpha}}+1) }{ {{beta}}^2 }={{answer}}
  $$
  これは形状 $\alpha$、率 $\beta$ のガンマ分布の積率母関数で、$E[X]=\alpha/\beta$、$V[X]=\alpha/\beta^2$ と整合する。
params:
  alpha: { min: 1, max: 6, step: 0.5 }
  beta: { min: 0.5, max: 4, step: 0.5 }
answer: alpha * (alpha + 1) / beta^2
display: { digits: 3 }
