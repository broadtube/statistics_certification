- id: ar1-moments
  topic: arma
  title: AR(1) の分散と自己相関
  body: 'X_t=\phi X_{t-1}+\varepsilon_t:\quad V[X_t]=\frac{\sigma^2}{1-\phi^2},\quad \rho_h=\phi^{|h|}'
  conditions: '定常（$|\phi|<1$）であること。'
  derivation: '定常性 $V[X_t]=V[X_{t-1}]$ と、$X_{t-h}$ を掛けて期待値をとる操作（$\gamma_h=\phi\gamma_{h-1}$）から導く。'
  tags: [時系列, ARモデル, 自己相関, 分散]
- id: ma1-acf
  topic: arma
  title: MA(1) の自己相関
  body: 'X_t=\varepsilon_t+\theta\varepsilon_{t-1}:\quad \rho_1=\frac{\theta}{1+\theta^2},\quad \rho_h=0\ (h\ge2)'
  pitfalls: '$X_t=\varepsilon_t-\theta\varepsilon_{t-1}$ と定義する流儀では符号が逆になる。$|\rho_1|\le1/2$。'
  tags: [時系列, MAモデル, 自己相関]
- id: yule-walker
  topic: arma
  title: ユール・ウォーカー方程式（AR(2)）
  body: '\rho_h=\phi_1\rho_{h-1}+\phi_2\rho_{h-2}\ (h\ge1),\qquad \rho_1=\frac{\phi_1}{1-\phi_2}'
  description: 自己相関から AR 係数を推定する（モーメント法）ときにも使う。
  tags: [時系列, ARモデル, 自己相関, ユール・ウォーカー]
- id: ar2-stationarity
  topic: arma
  title: AR(2) の定常条件
  body: '\phi_1+\phi_2<1,\quad \phi_2-\phi_1<1,\quad |\phi_2|<1'
  description: '特性方程式 $1-\phi_1z-\phi_2z^2=0$ の根がすべて単位円の外にある条件と同値。'
  tags: [時系列, ARモデル, 定常性]
- id: acf-pacf-pattern
  topic: arma
  title: ACF・PACF によるモデルの識別
  body: '\text{AR}(p):\ \text{PACF がラグ}\ p\ \text{で切断},\qquad \text{MA}(q):\ \text{ACF がラグ}\ q\ \text{で切断}'
  description: 'ARMA では ACF・PACF ともに減衰し、切断は見られない。'
  tags: [時系列, 自己相関, 偏自己相関, モデル選択]
- id: arch1-variance
  topic: arma
  title: ARCH(1) の条件付き分散と無条件分散
  body: '\varepsilon_t=\sigma_tz_t,\quad \sigma_t^2=\omega+\alpha\varepsilon_{t-1}^2,\qquad V[\varepsilon_t]=\frac{\omega}{1-\alpha}'
  conditions: '$z_t$ は平均 $0$・分散 $1$ の i.i.d.、$\omega>0$、$0\le\alpha<1$。'
  derivation: '$E[\varepsilon_t^2]=E[\sigma_t^2]=\omega+\alpha E[\varepsilon_{t-1}^2]$ に定常性 $E[\varepsilon_t^2]=E[\varepsilon_{t-1}^2]$ を使う。'
  pitfalls: '$\varepsilon_t$ 自体は無相関だが、$\varepsilon_t^2$ は $\varepsilon_t^2=\omega+\alpha\varepsilon_{t-1}^2+v_t$ と AR(1) 型になり、自己相関 $\alpha^h$ をもつ（4次モーメントが有限のとき）。'
  tags: [時系列, ARCH, ボラティリティ, 分散]
- id: garch11-variance
  topic: arma
  title: GARCH(1,1) の無条件分散と定常条件
  body: '\sigma_t^2=\omega+\alpha\varepsilon_{t-1}^2+\beta\sigma_{t-1}^2,\qquad V[\varepsilon_t]=\frac{\omega}{1-\alpha-\beta}\quad(\alpha+\beta<1)'
  conditions: '$\omega>0$、$\alpha,\beta\ge0$。$\alpha+\beta<1$ が（弱）定常で無条件分散が有限となる条件。'
  description: '$\alpha+\beta$ はボラティリティの持続性を表し、$1$ に近いほどショックの影響が長く残る。$\varepsilon_t^2$ は AR 係数 $\alpha+\beta$ の ARMA(1,1) 型になる。'
  tags: [時系列, GARCH, ボラティリティ, 定常性]
- id: garch-forecast
  topic: arma
  title: GARCH(1,1) の条件付き分散の予測
  body: '\sigma_{T+1}^2=\omega+\alpha\varepsilon_T^2+\beta\sigma_T^2,\qquad E[\sigma_{T+h}^2\mid\mathcal F_T]=\bar\sigma^2+(\alpha+\beta)^{h-1}(\sigma_{T+1}^2-\bar\sigma^2)'
  conditions: '$\bar\sigma^2=\omega/(1-\alpha-\beta)$。$\sigma_{T+1}^2$ は時点 $T$ までの情報で確定する。'
  derivation: '$E[\varepsilon_{t}^2\mid\mathcal F_{t-1}]=\sigma_{t}^2$ より $E[\sigma_{t+1}^2\mid\mathcal F_T]=\omega+(\alpha+\beta)E[\sigma_t^2\mid\mathcal F_T]$ を繰り返し使う。'
  tags: [時系列, GARCH, 予測, ボラティリティ]
