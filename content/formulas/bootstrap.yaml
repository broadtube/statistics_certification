- id: bootstrap-standard-error
  topic: bootstrap
  title: ブートストラップ標準誤差
  body: '\widehat{\mathrm{SE}}_{\mathrm{boot}}=\sqrt{\frac{1}{B-1}\sum_{b=1}^{B}\left(\hat\theta^{*}_b-\bar\theta^{*}\right)^2}'
  variables:
    - { symbol: '\hat\theta^{*}_b', meaning: 'b 番目のブートストラップ標本から計算した統計量' }
    - { symbol: 'B', meaning: ブートストラップの反復回数 }
  pitfalls: $B$ を増やして減るのはモンテカルロ誤差だけで、標本サイズ $n$ の小ささによる誤差は減らない。
  tags: [ブートストラップ, 標準誤差]
- id: bootstrap-bias-correction
  topic: bootstrap
  title: ブートストラップによるバイアス推定と補正
  body: '\widehat{\mathrm{bias}}=\bar\theta^{*}-\hat\theta,\qquad \tilde\theta=\hat\theta-\widehat{\mathrm{bias}}=2\hat\theta-\bar\theta^{*}'
  tags: [ブートストラップ, バイアス]
- id: bootstrap-percentile-interval
  topic: bootstrap
  title: パーセンタイル信頼区間とベーシック信頼区間
  body: '\left[\hat\theta^*_{(\alpha/2)},\ \hat\theta^*_{(1-\alpha/2)}\right],\qquad \left[2\hat\theta-\hat\theta^*_{(1-\alpha/2)},\ 2\hat\theta-\hat\theta^*_{(\alpha/2)}\right]'
  description: 左がパーセンタイル区間、右がベーシック（ピボット型）区間。
  pitfalls: ブートストラップ分布が $\hat\theta$ について対称なら両者は一致する。
  tags: [ブートストラップ, 信頼区間]
- id: bootstrap-exclusion-probability
  topic: bootstrap
  title: ブートストラップ標本に特定の観測値が含まれない確率
  body: '\left(1-\frac1n\right)^n\ \longrightarrow\ e^{-1}\approx0.368'
  derivation: 1回の抽出で選ばれない確率 $1-1/n$ を、独立な $n$ 回の抽出で掛け合わせる。
  tags: [ブートストラップ, 復元抽出]
- id: jackknife-bias
  topic: bootstrap
  title: ジャックナイフによるバイアス推定
  body: '\widehat{\mathrm{bias}}_{\mathrm{jack}}=(n-1)\left(\hat\theta_{(\cdot)}-\hat\theta\right),\qquad \hat\theta_{(\cdot)}=\frac1n\sum_{i=1}^n\hat\theta_{(-i)}'
  variables:
    - { symbol: '\hat\theta_{(-i)}', meaning: '$i$ 番目の観測値を除いて計算した統計量' }
  tags: [ジャックナイフ, バイアス]
- id: jackknife-standard-error
  topic: bootstrap
  title: ジャックナイフ標準誤差
  body: '\widehat{\mathrm{SE}}_{\mathrm{jack}}=\sqrt{\frac{n-1}{n}\sum_{i=1}^n\left(\hat\theta_{(-i)}-\hat\theta_{(\cdot)}\right)^2}'
  pitfalls: 標本中央値のような滑らかでない統計量では一致性をもたない。
  tags: [ジャックナイフ, 標準誤差]
