- id: ols-simple
  topic: linear-regression
  title: 単回帰の最小二乗推定量
  body: '\hat\beta_1=\frac{S_{xy}}{S_{xx}},\qquad \hat\beta_0=\bar y-\hat\beta_1\bar x'
  variables:
    - { symbol: 'S_{xy}', meaning: '偏差積和 $\sum(x_i-\bar x)(y_i-\bar y)$' }
    - { symbol: 'S_{xx}', meaning: '偏差平方和 $\sum(x_i-\bar x)^2$' }
  derivation: 正規方程式 $\partial\mathrm{RSS}/\partial\beta_0=\partial\mathrm{RSS}/\partial\beta_1=0$ を解く。回帰直線は必ず $(\bar x,\bar y)$ を通る。
  tags: [回帰, 最小二乗法, 推定量]
- id: ols-matrix
  topic: linear-regression
  title: 最小二乗推定量（行列形）とその分散
  body: '\hat{\boldsymbol\beta}=(X^\top X)^{-1}X^\top\boldsymbol y,\qquad V[\hat{\boldsymbol\beta}]=\sigma^2(X^\top X)^{-1}'
  conditions: '$X^\top X$ が正則（説明変数が完全な多重共線性をもたない）。分散の式は誤差が無相関・等分散のとき。'
  tags: [回帰, 最小二乗法, 推定量, 分散]
- id: sigma2-unbiased
  topic: linear-regression
  title: 誤差分散の不偏推定量
  body: '\hat\sigma^2=\frac{\mathrm{RSS}}{n-p-1},\qquad \frac{\mathrm{RSS}}{\sigma^2}\sim\chi^2(n-p-1)'
  variables:
    - { symbol: 'p', meaning: 切片を除く説明変数の数 }
  pitfalls: 分母は「標本サイズ − 推定したパラメータ数（切片を含む）」。
  tags: [回帰, 分散, 不偏推定量]
- id: r-squared
  topic: linear-regression
  title: 決定係数と自由度調整済み決定係数
  body: 'R^2=1-\frac{\mathrm{RSS}}{\mathrm{TSS}},\qquad \bar R^2=1-\frac{\mathrm{RSS}/(n-p-1)}{\mathrm{TSS}/(n-1)}'
  pitfalls: '$R^2$ は説明変数を追加すると減らない。$\bar R^2$ は負になることもある。'
  tags: [回帰, 決定係数, モデル選択]
- id: coef-t-test
  topic: linear-regression
  title: 回帰係数の t 検定
  body: 't=\frac{\hat\beta_j}{\widehat{\mathrm{SE}}(\hat\beta_j)}\ \sim\ t(n-p-1)\quad(H_0:\beta_j=0)'
  conditions: 誤差が独立に $N(0,\sigma^2)$ に従うこと。
  tags: [回帰, 検定, t分布]
- id: regression-f-test
  topic: linear-regression
  title: 回帰モデル全体の F 検定
  body: 'F=\frac{\mathrm{ESS}/p}{\mathrm{RSS}/(n-p-1)}=\frac{R^2/p}{(1-R^2)/(n-p-1)}\ \sim\ F(p,\ n-p-1)'
  conditions: '$H_0:\beta_1=\cdots=\beta_p=0$ のもと、誤差が独立に正規分布に従うこと。'
  tags: [回帰, 検定, F分布, 分散分析]
- id: gauss-markov
  topic: linear-regression
  title: ガウス・マルコフの定理
  description: 線形不偏推定量のなかで最小二乗推定量の分散が最小（BLUE）。
  body: 'V[\tilde{\boldsymbol\beta}]-V[\hat{\boldsymbol\beta}]\ \succeq\ O\quad(\tilde{\boldsymbol\beta}\ \text{は任意の線形不偏推定量})'
  conditions: 誤差の期待値が $0$、等分散、無相関。正規性は不要。
  tags: [回帰, 最小二乗法, BLUE]
- id: partial-correlation
  topic: linear-regression
  title: 偏相関係数
  description: '第3の変数 $x_3$ の影響を除いた $x_1$ と $x_2$ の相関。'
  body: 'r_{12\cdot3}=\frac{r_{12}-r_{13}\,r_{23}}{\sqrt{\left(1-r_{13}^2\right)\left(1-r_{23}^2\right)}}'
  variables:
    - { symbol: 'r_{ij}', meaning: '$x_i$ と $x_j$ の（標本）相関係数' }
  derivation: '$x_1$ を $x_3$ に単回帰した残差と、$x_2$ を $x_3$ に単回帰した残差の相関係数を計算すると、この式になる。'
  pitfalls: '$r_{12}$ と符号が逆になることも、$|r_{12}|$ より大きくなることもある（見かけの相関・抑制効果）。'
  tags: [相関, 偏相関係数, 回帰]
- id: partial-correlation-test
  topic: linear-regression
  title: 偏相関係数の無相関検定
  body: 't=\frac{r_{12\cdot3}\sqrt{n-3}}{\sqrt{1-r_{12\cdot3}^2}}\ \sim\ t(n-3)\quad(H_0:\rho_{12\cdot3}=0)'
  conditions: '$(x_1,x_2,x_3)$ が多変量正規分布に従う無作為標本。$q$ 個の変数で調整した偏相関なら自由度は $n-2-q$。'
  pitfalls: '通常の相関係数の検定（自由度 $n-2$）より、調整した変数の数だけ自由度が減る。$x_1$ を $x_2,x_3$ に重回帰したときの $x_2$ の係数の t 検定と同じ統計量になる。'
  tags: [相関, 偏相関係数, 検定, t分布]
