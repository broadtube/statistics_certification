- id: pca-eigen
  topic: pca
  title: 主成分と固有値問題
  description: 主成分の係数は分散共分散行列の固有ベクトル、主成分の分散は固有値。
  body: '\Sigma\boldsymbol a_k=\lambda_k\boldsymbol a_k,\quad z_k=\boldsymbol a_k^\top\boldsymbol x,\quad V[z_k]=\lambda_k'
  derivation: '$\boldsymbol a^\top\Sigma\boldsymbol a$ を $\boldsymbol a^\top\boldsymbol a=1$ のもとで最大化（ラグランジュの未定乗数法）。'
  tags: [主成分分析, 固有値, 次元削減]
- id: pca-contribution
  topic: pca
  title: 寄与率と累積寄与率
  body: '\frac{\lambda_k}{\sum_{j=1}^p\lambda_j},\qquad \frac{\sum_{j=1}^k\lambda_j}{\sum_{j=1}^p\lambda_j}'
  pitfalls: '相関行列に基づく場合、分母 $\sum_j\lambda_j$ は変数の数 $p$ に等しい。'
  tags: [主成分分析, 寄与率]
- id: pca-loading
  topic: pca
  title: 主成分負荷量
  description: 第 $k$ 主成分と変数 $x_j$ の相関係数。
  body: 'r(z_k,x_j)=\frac{\sqrt{\lambda_k}\,a_{kj}}{\sqrt{\sigma_{jj}}}'
  pitfalls: '相関行列に基づく場合は $\sigma_{jj}=1$ なので $\sqrt{\lambda_k}\,a_{kj}$。'
  tags: [主成分分析, 負荷量, 相関係数]
- id: pca-2x2-correlation
  topic: pca
  title: 2変数の相関行列の固有値・固有ベクトル
  body: 'R=\begin{pmatrix}1&r\\r&1\end{pmatrix}:\quad \lambda=1\pm r,\quad \boldsymbol a=\tfrac{1}{\sqrt2}(1,\pm1)^\top'
  tags: [主成分分析, 固有値, 相関係数]
- id: trace-eigenvalues
  topic: pca
  title: 固有値の和と総分散
  body: '\sum_{j=1}^p\lambda_j=\mathrm{tr}\,\Sigma=\sum_{j=1}^p\sigma_{jj},\qquad \prod_{j=1}^p\lambda_j=|\Sigma|'
  tags: [固有値, 行列, 主成分分析]
- id: cca-eigen
  topic: pca
  title: 正準相関分析と固有値問題
  description: '2組の変数 $\boldsymbol x$（$p$ 次元）と $\boldsymbol y$（$q$ 次元）について、線形結合 $u=\boldsymbol a^\top\boldsymbol x$ と $v=\boldsymbol b^\top\boldsymbol y$ の相関が最大になるものを求める（関連手法）。'
  body: '\Sigma_{11}^{-1}\Sigma_{12}\Sigma_{22}^{-1}\Sigma_{21}\,\boldsymbol a=\rho^2\boldsymbol a,\qquad \rho_1=\max_{\boldsymbol a,\boldsymbol b}\ \mathrm{Corr}(\boldsymbol a^\top\boldsymbol x,\boldsymbol b^\top\boldsymbol y)'
  conditions: '$\Sigma_{11}=V[\boldsymbol x]$、$\Sigma_{22}=V[\boldsymbol y]$、$\Sigma_{12}=\mathrm{Cov}[\boldsymbol x,\boldsymbol y]=\Sigma_{21}^\top$。$\Sigma_{11},\Sigma_{22}$ は正則。'
  derivation: '$V[u]=V[v]=1$ のもとで $\mathrm{Cov}[u,v]=\boldsymbol a^\top\Sigma_{12}\boldsymbol b$ を最大化（ラグランジュの未定乗数法）し、$\boldsymbol b\propto\Sigma_{22}^{-1}\Sigma_{21}\boldsymbol a$ を代入する。'
  pitfalls: '固有値は正準相関係数の **2乗**。正準相関は $\min(p,q)$ 個あり、変数の単位を変えても変わらない。'
  tags: [正準相関分析, 固有値, 相関係数, 多変量解析]
- id: cca-multiple-correlation
  topic: pca
  title: 片方が1変数のときの正準相関
  description: '$y$ が1変数なら、第1正準相関係数は $y$ を $\boldsymbol x$ に回帰したときの重相関係数 $R$ に一致する。'
  body: 'q=1:\ \rho_1^2=\boldsymbol r_{xy}^\top R_{xx}^{-1}\boldsymbol r_{xy}=R^2,\qquad p=2:\ R^2=\frac{r_{1}^2+r_{2}^2-2r_{1}r_{2}r_{12}}{1-r_{12}^2}'
  conditions: '$r_j=\mathrm{Corr}(x_j,y)$、$r_{12}=\mathrm{Corr}(x_1,x_2)$、$R_{xx}$ は $\boldsymbol x$ の相関行列。'
  tags: [正準相関分析, 重相関係数, 決定係数]
- id: cca-symmetric-2x2
  topic: pca
  title: 2変数×2変数の正準相関（対称な場合）
  body: '\begin{gathered}\mathrm{Corr}(x_1,x_2)=r,\ \mathrm{Corr}(y_1,y_2)=s,\ \mathrm{Corr}(x_i,y_i)=a,\ \mathrm{Corr}(x_i,y_j)=b\ (i\ne j)\\ \Rightarrow\ \text{正準相関}=\frac{|a+b|}{\sqrt{(1+r)(1+s)}},\ \frac{|a-b|}{\sqrt{(1-r)(1-s)}}\end{gathered}'
  description: '対称性から正準変量の係数は $(1,1)$ と $(1,-1)$ の向きになり、和どうし・差どうしの相関が正準相関になる。大きい方が第1正準相関。'
  tags: [正準相関分析, 相関係数, 固有値]
