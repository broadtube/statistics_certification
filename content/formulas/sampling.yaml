- id: srs-mean-variance-fpc
  topic: sampling
  title: 単純無作為非復元抽出での標本平均の分散
  description: 有限母集団修正 $1-n/N$ が掛かる。
  body: 'V[\bar y]=\left(1-\frac nN\right)\frac{S^2}{n},\qquad S^2=\frac{1}{N-1}\sum_{i=1}^N(y_i-\bar Y)^2'
  conditions: 非復元の単純無作為抽出。
  pitfalls: '母分散を $N$ で割る形 $\sigma^2$ で書くと $V[\bar y]=\frac{N-n}{N-1}\frac{\sigma^2}{n}$。'
  tags: [標本調査, 有限母集団修正, 単純無作為抽出]
- id: sampling-required-size
  topic: sampling
  title: 必要標本サイズ（有限母集団修正つき）
  description: 誤差の限界 $d$ を信頼係数 95% で達成する標本サイズ。
  body: 'n_0=\left(\frac{1.96\,S}{d}\right)^2,\qquad n=\frac{n_0}{1+n_0/N}'
  derivation: '$1.96\sqrt{(1-n/N)S^2/n}=d$ を $n$ について解く。'
  tags: [標本調査, 標本サイズ, 有限母集団修正]
- id: stratified-mean-variance
  topic: sampling
  title: 層化抽出の推定量と分散
  description: 層ごとの標本平均を層の大きさの比率で重み付けする。
  body: '\bar y_{st}=\sum_{h=1}^H W_h\bar y_h,\qquad V[\bar y_{st}]=\sum_{h=1}^H W_h^2\left(1-\frac{n_h}{N_h}\right)\frac{S_h^2}{n_h}'
  conditions: '$W_h=N_h/N$。各層から独立に単純無作為抽出。'
  tags: [層化抽出, 分散]
- id: neyman-allocation
  topic: sampling
  title: ネイマン配分
  description: 総標本サイズ $n$ が一定のとき、層化推定量の分散を最小にする配分。
  body: 'n_h=n\cdot\frac{N_hS_h}{\sum_{k=1}^H N_kS_k}'
  derivation: 'ラグランジュの未定乗数法で $\sum_h W_h^2S_h^2/n_h$ を $\sum_h n_h=n$ のもとで最小化する。'
  pitfalls: '比例配分 $n_h=nN_h/N$ は、層の標準偏差が等しいときにネイマン配分と一致する。'
  tags: [層化抽出, 標本配分]
- id: horvitz-thompson-total
  topic: sampling
  title: ホルビッツ・トンプソン推定量
  description: 包含確率の逆数で重み付けした母集団総計の不偏推定量。
  body: '\hat Y_{HT}=\sum_{i\in s}\frac{y_i}{\pi_i},\qquad E\left[\hat Y_{HT}\right]=\sum_{i=1}^N y_i'
  derivation: '指示変数 $I_i$（$i$ が標本に入れば 1）を使うと $E[\hat Y_{HT}]=\sum_i y_iE[I_i]/\pi_i=\sum_i y_i$。'
  conditions: すべての個体で $\pi_i>0$。
  tags: [包含確率, 不偏推定量, 標本調査]
- id: ratio-estimator
  topic: sampling
  title: 比推定量とその近似分散
  description: 母平均 $\bar X$ が既知の補助変数 $x$ を使って $y$ の母平均（母集団総計）を推定する。
  body: '\hat R=\frac{\bar y}{\bar x},\quad \bar y_R=\hat R\,\bar X,\qquad V[\bar y_R]\approx\left(1-\frac nN\right)\frac{1}{n}\left(S_y^2-2RS_{xy}+R^2S_x^2\right)'
  derivation: '$\bar y_R-\bar Y\approx\bar y-R\bar x$（$R=\bar Y/\bar X$）と線形化すると、$d_i=y_i-Rx_i$ の標本平均の分散になる。$S_d^2=S_y^2-2RS_{xy}+R^2S_x^2$。'
  conditions: 単純無作為抽出で、標本サイズが十分大きいこと（近似分散）。
  pitfalls: '比推定量は一般に不偏ではない（偏りは $O(1/n)$）。分散の推定では $R$ を $\hat R$ で、母分散・母共分散を標本の値で置き換える。'
  tags: [標本調査, 比推定, 補助変数]
- id: ratio-estimator-efficiency
  topic: sampling
  title: 比推定が有効な条件と回帰推定量
  description: '比推定量は回帰推定量 $\bar y_{lr}=\bar y+b(\bar X-\bar x)$ で傾きを $b=\hat R$ とした（原点を通る直線の）場合にあたる。'
  body: 'V[\bar y_R]<V[\bar y]\iff\rho>\frac12\cdot\frac{C_x}{C_y},\qquad V[\bar y_{lr}]\approx\left(1-\frac nN\right)\frac{S_y^2}{n}(1-\rho^2)'
  derivation: '$S_y^2-2RS_{xy}+R^2S_x^2<S_y^2$ を $S_{xy}=\rho S_xS_y$、$C_x=S_x/\bar X$、$C_y=S_y/\bar Y$ で書き直す（$R>0$）。'
  conditions: '$C_x,C_y$ は変動係数。比推定は $y$ が $x$ にほぼ比例する（原点を通る直線関係で、ばらつきが $x$ とともに増える）とき特に有効。'
  pitfalls: '回帰推定量の近似分散は比推定量の近似分散以下。両者が一致するのは母集団の回帰直線が原点を通る（回帰係数 $B=S_{xy}/S_x^2$ が $R$ に等しい）とき。'
  tags: [標本調査, 比推定, 回帰推定, 効率]
